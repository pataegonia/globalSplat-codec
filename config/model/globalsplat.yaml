# GlobalSplat model hyper-parameters (passed as kwargs to src.model.globalsplat.GlobalSplat).
name: globalsplat
sh_degree: 3
static_only: true

# Encoder / tokenization
patch_size: 8
latent_rep_token_amount: 2048
dim_latents: 512
dim_rays: 256
dim_rgb_feat: 512

rounds: 4
slot_calib_layers_per_round: 2

# Candidate splats predicted per token before coarse-to-fine gating. The
# curriculum's final_stage must satisfy 2**final_stage <= M_max. 16K/32K use 16;
# the 2K model was trained with M_max=2 (see config/experiment/re10k_2k.yaml).
M_max: 16

use_camera_diff_as_input: false

# 0 disables the codec. 4/6/8 runs transform-free scalar quantization followed
# by static arithmetic encode/decode between the slot encoder and decoder.
latent_codec_bits: 0
latent_codec_backend: compressai
# When both are non-zero they override latent_codec_bits and allow asymmetric
# allocation between the two streams.
latent_codec_texture_bits: 0
latent_codec_geometry_bits: 0
latent_codec_scale_mode: global       # global | channel
latent_codec_clip_percentile: null    # null=max; e.g. 99.9 enables clipping
# Entropy model. fixed_grouped uses one shared train-calibrated profile and
# transmits no scene-specific CDF. See config/codec/final_g9_t7_g32_t32.yaml.
latent_codec_cdf_mode: adaptive_scene_k1  # adaptive_scene_k1 | fixed_grouped
latent_codec_profile_path: null
latent_codec_texture_groups: 1
latent_codec_geometry_groups: 1
latent_codec_cdf_precision: 16
latent_codec_cdf_alpha: 0.5
